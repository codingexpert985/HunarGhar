# Optional: run PostgreSQL locally without installing it.   docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hunarghar
    ports:
      - "5432:5432"
    volumes:
      - hunarghar_pgdata:/var/lib/postgresql/data
volumes:
  hunarghar_pgdata:
